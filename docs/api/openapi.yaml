      summary: Xóa Zalo account (master only)
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /api/admin/accounts/{accountId}/logout:
    post:
      tags: [Admin]
      summary: Force logout Zalo account (master only)
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /api/admin/accounts/{accountId}/sync-profile:
    post:
      tags: [Admin]
      summary: Đồng bộ profile từ Zalo API (master only)
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sync thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncProfileResponse'

  /api/me/accounts/{accountId}/visible:
    put:
      tags: [Admin]
      summary: Ẩn/hiện account trong sidebar (cá nhân)
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visible: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  visible: { type: boolean }

  # =========================================================================
  # MEDIA
  # =========================================================================
  /media/{*path}:
    get:
      tags: [Media]
      summary: Stream media file từ MinIO
      security: []
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: "Object path trong MinIO bucket"
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string, format: binary
        "404":
          description: File không tồn tại
